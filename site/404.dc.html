</helmet>
<div style="border-bottom:1px solid #000000;font-family:'museo-sans',sans-serif;font-weight:500;">

    </div>
  </nav>
</div>
<main data-screen-label="Not found" style="max-width:1440px;margin:0 auto;padding:{{ mainPad }};box-sizing:border-box;display:flex;flex-direction:column;gap:32px;">

</main>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mob: window.innerWidth < 768, wide: window.innerWidth >= 1200 };
  onResize = () => { const mob = window.innerWidth < 768, wide = window.innerWidth >= 1200; if (mob !== this.state.mob || wide !== this.state.wide) this.setState({ mob, wide }); };
  componentDidMount() { window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    return {
      h1Size: this.state.wide ? '200px' : '16vw',
      mainPad: this.state.mob ? '80px 40px 64px' : '120px 40px 160px'
    };
  }
}
</script>
